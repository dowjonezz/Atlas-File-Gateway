services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - ./storage:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    pids_limit: 100
    mem_limit: 256m
